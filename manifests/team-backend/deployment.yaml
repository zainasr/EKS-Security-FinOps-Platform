apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: team-backend
  labels:
    app: backend-app
    team: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
        team: backend
    spec:
      containers:
      - name: api
        image: python:3.11-slim

        command: ["python3", "-c"]
        args:
          - |
            import http.server, socketserver
            class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'{"status":"ok","team":"backend"}')
            with socketserver.TCPServer(("",8080),Handler) as h:
              print("Backend running on 8080")
              h.serve_forever()

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        securityContext:
          # VIOLATION 1: explicitly running as root
          # runAsUser: 0 = root
          # Real risk: any exploit in this app = root access
          runAsUser: 0
          runAsGroup: 0

          # VIOLATION 2: writable filesystem
          # readOnlyRootFilesystem not set to true
          # Real risk: attacker can write malware to container filesystem
          readOnlyRootFilesystem: false

          # VIOLATION 3: allowPrivilegeEscalation not disabled
          # Real risk: process inside can gain more privileges via setuid
          allowPrivilegeEscalation: true

---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: team-backend
  labels:
    team: backend
spec:
  selector:
    app: backend-app
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP